[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2chip"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Describe what your camera should see. Get a tiny model ready to flash on a $10 chip."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The core (spec, pipeline, backends) is stdlib only so it also runs inside Isaac Sim's Python.
# Stage dependencies live in the runtime that executes them.
train = ["tensorflow>=2.18,<2.19", "numpy", "pillow"]
assets = ["objaverse", "numpy"]
cloud = ["boto3"]
web = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "httpx"]

[project.scripts]
sim2chip = "sim2chip.cli:main"

[tool.setuptools.packages.find]
include = ["sim2chip*"]

[tool.setuptools.package-data]
sim2chip = ["web/*", "web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

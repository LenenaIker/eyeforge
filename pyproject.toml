[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2chip"
version = "0.9.0"
license = "Apache-2.0"
description = "Describe what your camera should see. Get a tiny model ready to run on your own device."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The core (spec, pipeline, backends) is stdlib only so it also runs inside Isaac Sim's Python.
# Stage dependencies live in the runtime that executes them.
# The count detector's ONNX becomes a TFLite with onnx2tf (detector.py); its pieces are pinned to a set that
# works with TensorFlow 2.18 (install with --no-deps if pip resolves newer onnx or protobuf).
train = ["tensorflow>=2.18,<2.19", "numpy", "pillow", "onnx==1.17.0", "onnx2tf==1.29.24", "onnx_graphsurgeon==0.6.1",
         "sng4onnx==2.0.1", "tf_keras==2.18.0", "onnxruntime==1.20.1", "ai_edge_litert==2.2.0", "psutil"]
assets = ["objaverse", "numpy"]
cloud = ["boto3"]
web = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
sim2chip = "sim2chip.cli:main"

[tool.setuptools.packages.find]
include = ["sim2chip*"]

[tool.setuptools.package-data]
sim2chip = ["web/*", "web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# experiments/ holds closed tests; the scene route under it is product code and is linted by naming it:
# ruff check sim2chip tests experiments/worldstereo/wsroute experiments/worldstereo/ws_route.py
extend-exclude = ["experiments", "sim2chip/web", "web"]

[tool.ruff.lint]
# Conservative on purpose: real mistakes (pyflakes, bugbear) and simple style, no rewrites of working code.
select = ["E", "F", "W", "B"]
# E501: long lines are left to review. B905: strict zips would change behaviour. B008: FastAPI's File()/Form()
# defaults. E741: `l` for lines is read fine here. B023: our closures in loops run within the same iteration.
ignore = ["E501", "B905", "B008", "E741", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B017"]
"experiments/worldstereo/wsroute/run_ws.py" = ["E401", "E402"]  # patches WorldStereo's script in its own image  # one-line fakes, and pytest.raises(Exception) where any failure is the point

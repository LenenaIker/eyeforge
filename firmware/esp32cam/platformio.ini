; EyeForge runner for the AI-Thinker ESP32-CAM. Built once and published; each model is flashed
; on its own into the "model" partition (see partitions.csv and README.md).
[env:esp32cam]
platform = espressif32@7.1.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

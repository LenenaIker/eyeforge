; EyeForge runner for the AI-Thinker ESP32-CAM. Built once and published; each model is flashed
; on its own into the "model" partition (see partitions.csv and README.md).
[env:esp32cam]
platform = espressif32@7.1.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; Seeed Studio XIAO ESP32S3 Sense (the board of GreatScott!'s lawn robot): same program, its camera pins
; (src/camera_pins.h), and the console on the chip's own USB (sdkconfig.defaults.esp32s3).
[env:xiao_esp32s3]
platform = espressif32@7.1.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; Emulator builds for tools/qemu_test.sh: no camera, a fixed frame instead (EYEFORGE_TEST_FRAME), the
; console on UART0. They check that a model loads and gives the same answer as on the PC.
[env:qemu_esp32]
extends = env:esp32cam
build_flags = -DEYEFORGE_TEST_FRAME -I ${PROJECT_DIR}/test_frame
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.qemu"

[env:qemu_esp32s3]
extends = env:xiao_esp32s3
build_flags = -DEYEFORGE_TEST_FRAME -I ${PROJECT_DIR}/test_frame
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.qemu"

<title>Criba de vehículos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #eceee9;
  --surface: #ffffff;
  --surface-2: #f5f6f3;
  --ink: #1b1e1c;
  --muted: #5d645e;
  --line: #d5d9d3;
  --accent: #c99700;
  --accent-soft: #f7ecc6;
  --keep: #2c7a4b;
  --keep-soft: #dcefe2;
  --discard: #b3392d;
  --discard-soft: #f6dcd8;
  --overlay: rgba(14, 16, 15, 0.92);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #131614;
    --surface: #1c201d;
    --surface-2: #232824;
    --ink: #e5e8e3;
    --muted: #9aa29b;
    --line: #333a35;
    --accent: #f0be2a;
    --accent-soft: #3a3217;
    --keep: #5cc085;
    --keep-soft: #1d3326;
    --discard: #ec7a6c;
    --discard-soft: #3d221f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #131614;
  --surface: #1c201d;
  --surface-2: #232824;
  --ink: #e5e8e3;
  --muted: #9aa29b;
  --line: #333a35;
  --accent: #f0be2a;
  --accent-soft: #3a3217;
  --keep: #5cc085;
  --keep-soft: #1d3326;
  --discard: #ec7a6c;
  --discard-soft: #3d221f;
}
* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--display);
  font-size: 15px;
  line-height: 1.45;
}
.wrap { padding: 0 16px 48px; max-width: 1480px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Barra superior */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ground);
  padding-block: 14px 12px;
  border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 {
  margin: 0; font-size: 26px; font-weight: 800; font-stretch: 72%;
  letter-spacing: 0.01em; text-transform: uppercase;
}
.sub { color: var(--muted); font-size: 14px; }
.stats { margin-left: auto; display: flex; gap: 16px; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { font-weight: 600; }
.stats .chg { color: var(--accent); }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .k { background: var(--keep); }
.meter .d { background: var(--discard); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; font-size: 13px; font-weight: 600;
  font-stretch: 85%; border-right: 1px solid var(--line); white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg .n { font-family: var(--mono); font-weight: 400; opacity: 0.7; margin-left: 4px; font-size: 12px; }
.go {
  margin-left: auto; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 700;
  background: var(--accent); color: #1b1e1c; font-stretch: 85%;
}
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--discard); }

/* Rejilla */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-top: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
.card.final-discard .views { opacity: 0.55; }
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); }
.views button { border: 0; padding: 0; background: var(--surface-2); display: block; }
.views img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.meta { padding: 10px 12px 12px; display: grid; gap: 8px; align-content: start; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cls { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-stretch: 80%; }
.lvis { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.name { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dims { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; font-stretch: 85%; }
.pill.keep { background: var(--keep-soft); color: var(--keep); }
.pill.discard { background: var(--discard-soft); color: var(--discard); }
.pill.changed { background: var(--accent-soft); color: var(--ink); }
.pill.pending { background: var(--surface-2); color: var(--muted); }
.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.decide button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 8px;
  font-weight: 700; font-size: 14px; font-stretch: 85%;
}
.decide .b-keep[aria-pressed="true"] { background: var(--keep); border-color: var(--keep); color: #fff; }
.decide .b-discard[aria-pressed="true"] { background: var(--discard); border-color: var(--discard); color: #fff; }
.decide button:disabled { cursor: not-allowed; opacity: 0.5; }
.src { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.src a { color: inherit; }
details { font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
details input { width: 100%; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); font: inherit; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* Modo rápido */
.lb {
  position: fixed; inset: 0; z-index: 20; background: var(--overlay); color: #eef0ec;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
  gap: 10px;
}
.lb-top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.lb-top .name { color: #fff; font-size: 18px; -webkit-line-clamp: 1; }
.lb-top .lvis, .lb-top .dims { color: #b8bfb9; }
.lb-pos { margin-left: auto; font-family: var(--mono); font-size: 13px; color: #b8bfb9; }
.lb-x { border: 1px solid #555; background: transparent; border-radius: 6px; padding: 4px 10px; color: #eef0ec; }
.lb-views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-height: 0; align-content: center; justify-items: center; }
.lb-views img { max-width: 100%; max-height: calc((100vh - 190px) / 2); width: auto; height: auto; image-rendering: auto; border-radius: 4px; }
.lb-bottom { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.lb-bottom button {
  border: 1px solid #555; background: #222724; color: #eef0ec; border-radius: 6px; padding: 9px 16px;
  font-weight: 700; font-stretch: 85%;
}
.lb-bottom .b-keep[aria-pressed="true"] { background: var(--keep); border-color: var(--keep); }
.lb-bottom .b-discard[aria-pressed="true"] { background: var(--discard); border-color: var(--discard); }
.kbd { font-family: var(--mono); font-size: 11px; opacity: 0.7; margin-left: 6px; }
.lb-note { color: #b8bfb9; font-size: 13px; }
@media (max-width: 640px) {
  .stats { margin-left: 0; }
  .go { margin-left: 0; }
  .lb-views img { max-height: calc((100vh - 260px) / 2); }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color 0.15s; }
}
</style>

<div class="wrap">
  <header class="bar">
    <div class="head">
      <h1>Criba de vehículos</h1>
      <span class="sub">Modelos 3D de Objaverse para el generador sintético. Confirma o corrige mi veredicto.</span>
      <div class="stats" aria-live="polite">
        <span>Revisados <b id="s-rev">0</b>/<b id="s-tot">0</b></span>
        <span>Sirven <b id="s-keep">0</b></span>
        <span>No sirven <b id="s-dis">0</b></span>
        <span class="chg">Cambiados <b id="s-chg">0</b></span>
      </div>
    </div>
    <div class="meter" aria-hidden="true"><i class="k" id="m-k"></i><i class="d" id="m-d"></i></div>
    <div class="controls">
      <div class="seg" id="f-cls" role="group" aria-label="Clase"></div>
      <div class="seg" id="f-state" role="group" aria-label="Estado"></div>
      <button class="go" id="go">Revisión rápida</button>
    </div>
    <div class="status" id="status">Conectando con el guardado…</div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Revisión rápida">
  <div class="lb-top">
    <span class="cls" id="lb-cls"></span>
    <span class="name" id="lb-name"></span>
    <span class="lvis" id="lb-lvis"></span>
    <span class="dims" id="lb-dims"></span>
    <span class="lb-pos" id="lb-pos"></span>
    <button class="lb-x" id="lb-x">Cerrar <span class="kbd">Esc</span></button>
  </div>
  <div class="lb-views" id="lb-views"></div>
  <div class="lb-bottom">
    <button id="lb-prev">Anterior <span class="kbd">←</span></button>
    <span class="lb-note" id="lb-claude"></span>
    <button class="b-keep" id="lb-keep">Sirve <span class="kbd">S</span></button>
    <button class="b-discard" id="lb-dis">No sirve <span class="kbd">N</span></button>
    <button id="lb-next">Siguiente <span class="kbd">→</span></button>
  </div>
</div>

<script type="application/json" id="assets">__ASSETS_JSON__</script>
<script>
(() => {
  const ASSETS = JSON.parse(document.getElementById("assets").textContent);
  const CLASSES = [["all", "Todas"], ["small_vehicle", "Pequeño"], ["large_vehicle", "Grande"], ["motorcycle", "Moto"], ["bicycle", "Bici"]];
  const STATES = [["all", "Todos"], ["pending", "Pendientes"], ["c-discard", "Descartados por Claude"], ["c-keep", "Aceptados por Claude"], ["changed", "Cambiados por ti"]];
  const reviews = {};          // uid -> {decision, note, at}
  let db = null;
  let canWrite = true;
  let fCls = "all", fState = "all";
  let lbList = [], lbIdx = -1;

  const $ = (id) => document.getElementById(id);
  const final = (a) => (reviews[a.uid] && reviews[a.uid].decision) || a.claude;
  const isChanged = (a) => reviews[a.uid] && reviews[a.uid].decision && reviews[a.uid].decision !== a.claude;
  const label = (d) => (d === "keep" ? "sirve" : "no sirve");

  function matches(a) {
    if (fCls !== "all" && a.cls !== fCls) return false;
    const r = reviews[a.uid];
    if (fState === "pending") return !(r && r.decision);
    if (fState === "c-discard") return a.claude === "discard";
    if (fState === "c-keep") return a.claude === "keep";
    if (fState === "changed") return isChanged(a);
    return true;
  }

  function segButtons(el, opts, get, set, counter) {
    el.textContent = "";
    for (const [key, text] of opts) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(get() === key));
      b.append(text);
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = counter(key);
      b.append(n);
      b.addEventListener("click", () => { set(key); renderAll(); });
      el.append(b);
    }
  }

  function renderStats() {
    const tot = ASSETS.length;
    let rev = 0, keep = 0, chg = 0;
    for (const a of ASSETS) {
      if (reviews[a.uid] && reviews[a.uid].decision) rev++;
      if (final(a) === "keep") keep++;
      if (isChanged(a)) chg++;
    }
    $("s-rev").textContent = rev; $("s-tot").textContent = tot;
    $("s-keep").textContent = keep; $("s-dis").textContent = tot - keep; $("s-chg").textContent = chg;
    $("m-k").style.width = (100 * keep / tot) + "%";
    $("m-d").style.width = (100 * (tot - keep) / tot) + "%";
    const clsCount = (k) => ASSETS.filter((a) => k === "all" || a.cls === k).length;
    const stCount = (k) => { const s = fState; fState = k; const n = ASSETS.filter((a) => (fCls === "all" || a.cls === fCls) && matches(a)).length; fState = s; return n; };
    segButtons($("f-cls"), CLASSES, () => fCls, (k) => { fCls = k; }, clsCount);
    segButtons($("f-state"), STATES, () => fState, (k) => { fState = k; }, stCount);
  }

  function card(a) {
    const c = document.createElement("article");
    c.className = "card final-" + final(a);
    c.dataset.uid = a.uid;
    const views = document.createElement("div");
    views.className = "views";
    a.img.forEach((src, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Ampliar " + a.name + ", vista " + (i + 1));
      const im = document.createElement("img");
      im.src = src; im.alt = ""; im.loading = "lazy"; im.width = 256; im.height = 192;
      b.append(im);
      b.addEventListener("click", () => openLb(a.uid));
      views.append(b);
    });
    const m = document.createElement("div");
    m.className = "meta";
    const r1 = document.createElement("div"); r1.className = "row";
    const cls = document.createElement("span"); cls.className = "cls"; cls.textContent = a.clsEs;
    const lv = document.createElement("span"); lv.className = "lvis"; lv.textContent = a.lvis;
    r1.append(cls, lv);
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = a.name; nm.title = a.name;
    const dm = document.createElement("div"); dm.className = "dims";
    dm.textContent = a.dims.map((d) => d.toFixed(1)).join(" × ") + " m";
    const r2 = document.createElement("div"); r2.className = "row";
    const pc = document.createElement("span"); pc.className = "pill " + a.claude; pc.textContent = "Claude: " + label(a.claude);
    r2.append(pc);
    const r = reviews[a.uid];
    const ps = document.createElement("span");
    if (isChanged(a)) { ps.className = "pill changed"; ps.textContent = "Cambiado por ti"; }
    else if (r && r.decision) { ps.className = "pill " + r.decision; ps.textContent = "Confirmado"; }
    else { ps.className = "pill pending"; ps.textContent = "Pendiente"; }
    r2.append(ps);
    const dec = document.createElement("div"); dec.className = "decide";
    for (const [d, t, k] of [["keep", "Sirve", "b-keep"], ["discard", "No sirve", "b-discard"]]) {
      const b = document.createElement("button");
      b.type = "button"; b.className = k; b.textContent = t; b.disabled = !canWrite;
      b.setAttribute("aria-pressed", String(!!(r && r.decision === d)));
      b.addEventListener("click", () => decide(a.uid, d));
      dec.append(b);
    }
    const note = document.createElement("details");
    const sm = document.createElement("summary"); sm.textContent = r && r.note ? "Nota: " + r.note : "Añadir nota";
    const inp = document.createElement("input");
    inp.id = "note-" + a.uid; inp.type = "text"; inp.placeholder = "p. ej. lleva peana, escala rara…";
    inp.value = (r && r.note) || ""; inp.disabled = !canWrite;
    inp.addEventListener("change", () => saveNote(a.uid, inp.value.trim()));
    note.append(sm, inp);
    const src = document.createElement("div"); src.className = "src";
    const lic = document.createElement("span"); lic.textContent = "CC " + a.license + (a.author ? " · " + a.author : "");
    src.append(lic);
    if (a.source) {
      const link = document.createElement("a"); link.href = a.source; link.target = "_blank"; link.rel = "noopener";
      link.textContent = "Ver en 3D (Sketchfab)"; src.append(link);
    }
    m.append(r1, nm, dm, r2, dec, note, src);
    c.append(views, m);
    return c;
  }

  function renderGrid() {
    const g = $("grid");
    const list = ASSETS.filter(matches);
    g.textContent = "";
    if (!list.length) {
      const e = document.createElement("p"); e.className = "empty"; e.textContent = "No hay modelos con estos filtros.";
      g.append(e); return;
    }
    const frag = document.createDocumentFragment();
    for (const a of list) frag.append(card(a));
    g.append(frag);
  }

  function renderAll() { renderStats(); renderGrid(); if (!$("lb").hidden) renderLb(); }

  async function write(uid, patch) {
    const prev = reviews[uid] ? { ...reviews[uid] } : null;
    reviews[uid] = { ...(prev || {}), ...patch, at: new Date().toISOString() };
    renderAll();
    if (!db) { saveLocal(); return; }
    try {
      await db.collection("reviews").doc(uid).set({ ...reviews[uid] });
      setStatus("Guardado.", false);
    } catch (e) {
      if (prev) reviews[uid] = prev; else delete reviews[uid];
      renderAll();
      if (e && e.code === "invalid_argument") { canWrite = false; renderAll(); setStatus("Solo lectura: no tienes permiso para guardar decisiones aquí.", true); }
      else setStatus("No se pudo guardar (" + ((e && e.code) || "error") + "). Vuelve a pulsar en unos segundos.", true);
    }
  }
  const decide = (uid, d) => write(uid, { decision: d });
  const saveNote = (uid, note) => write(uid, { note });

  function setStatus(t, warn) { const s = $("status"); s.textContent = t; s.classList.toggle("warn", !!warn); }

  function saveLocal() {
    try { localStorage.setItem("criba-reviews", JSON.stringify(reviews)); } catch (e) { /* sin almacenamiento */ }
  }
  function loadLocal() {
    try { Object.assign(reviews, JSON.parse(localStorage.getItem("criba-reviews") || "{}")); } catch (e) { /* vacío */ }
  }

  // Modo rápido
  function openLb(uid) {
    lbList = ASSETS.filter(matches);
    lbIdx = Math.max(0, lbList.findIndex((a) => a.uid === uid));
    $("lb").hidden = false;
    renderLb();
    $("lb-keep").focus();
  }
  function renderLb() {
    const a = lbList[lbIdx];
    if (!a) { closeLb(); return; }
    $("lb-cls").textContent = a.clsEs;
    $("lb-name").textContent = a.name;
    $("lb-lvis").textContent = a.lvis;
    $("lb-dims").textContent = a.dims.map((d) => d.toFixed(1)).join(" × ") + " m";
    $("lb-pos").textContent = (lbIdx + 1) + " / " + lbList.length;
    const v = $("lb-views"); v.textContent = "";
    a.img.forEach((src) => { const im = document.createElement("img"); im.src = src; im.alt = ""; v.append(im); });
    const r = reviews[a.uid];
    $("lb-claude").textContent = "Claude: " + label(a.claude) + (isChanged(a) ? " · cambiado por ti" : "");
    $("lb-keep").setAttribute("aria-pressed", String(!!(r && r.decision === "keep")));
    $("lb-dis").setAttribute("aria-pressed", String(!!(r && r.decision === "discard")));
    $("lb-keep").disabled = $("lb-dis").disabled = !canWrite;
  }
  function closeLb() { $("lb").hidden = true; }
  function step(n) { lbIdx = Math.min(lbList.length - 1, Math.max(0, lbIdx + n)); renderLb(); }
  async function lbDecide(d) {
    const a = lbList[lbIdx]; if (!a || !canWrite) return;
    await decide(a.uid, d);
    if (lbIdx < lbList.length - 1) step(1);
  }
  $("lb-x").addEventListener("click", closeLb);
  $("lb-prev").addEventListener("click", () => step(-1));
  $("lb-next").addEventListener("click", () => step(1));
  $("lb-keep").addEventListener("click", () => lbDecide("keep"));
  $("lb-dis").addEventListener("click", () => lbDecide("discard"));
  document.addEventListener("keydown", (e) => {
    if ($("lb").hidden || e.target.tagName === "INPUT") return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "s" || e.key === "S") lbDecide("keep");
    else if (e.key === "n" || e.key === "N") lbDecide("discard");
  });
  $("go").addEventListener("click", () => {
    const list = ASSETS.filter(matches);
    const first = list.find((a) => !(reviews[a.uid] && reviews[a.uid].decision)) || list[0];
    if (first) openLb(first.uid);
  });

  loadLocal();
  renderAll();

  // Guardado compartido: las decisiones van al db del artifact para que Claude las lea
  (async () => {
    const use = window.claude && window.claude.use;
    db = use ? await window.claude.use("db") : null;
    if (!db) {
      setStatus("Sin guardado en servidor en esta vista: las decisiones se quedan en este navegador.", true);
      return;
    }
    const user = await window.claude.use("user");
    if (user && user.can) {
      const w = await user.can("data.write");
      if (w === false) { canWrite = false; setStatus("Solo lectura: no tienes permiso para guardar decisiones aquí.", true); }
    }
    db.collection("reviews").onSnapshot((snap) => {
      for (const k of Object.keys(reviews)) delete reviews[k];
      for (const d of snap.docs) { if (d.exists) reviews[d.id] = { ...d.data() }; }
      if (canWrite) setStatus("Las decisiones se guardan automáticamente y Claude puede leerlas.", false);
      renderAll();
    }, (e) => setStatus("Se perdió la conexión con el guardado (" + e.code + "). Recarga la página.", true));
  })();
})();
</script>

# EyeForge demo on a small server shared with another site (docs/deploy.md). The other site's nginx owns
# ports 80 and 443 and reaches this container by name on the external network "eyeforge"; nothing is
# published here. The image comes from deploy.sh (built on the workstation, loaded on the server).
services:
  eyeforge:
    image: eyeforge:latest
    container_name: eyeforge
    restart: unless-stopped
    command: ["sim2chip", "serve", "--backend", "nebius", "--public", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      SIM2CHIP_HOME: /data
      # Only nginx reaches this port: trust its X-Forwarded-* headers (https as the browser sees it).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/data              # jobs, uploads, accounts.db, spend records
      - ./nebius:/root/.nebius    # the nebius CLI profile of the service account and its key
    # The server has 2 vCPU and 4 GB for both sites: the GPU work runs in Nebius, this only serves.
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [eyeforge]

networks:
  eyeforge:
    external: true
